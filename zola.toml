# ===== Important Data =====
base_url = "https://kakalot17.github.io"

# ===== Optional Data =====
title = "Kakalot's Site"
description = "Site of a very young man"
author = "Mateus Barbosa"
taxonomies = [
  { name = "tags" }
]

# ===== Sassy CSS =====
compile_sass = true
# ===== Feeds =====
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

# ===== Markdown =====
[markdown]
github_alerts = true
highlighting = {
  theme = "gruvbox-dark-hard"
}

# ===== Custom Variables =====
[extra]
navbar = [
  { name = "Home", url = "/" },
  { name = "Personal", category = [
    { name = "About", url = "about/" },
    { name = "Socials", url = "socials/" },
    { name = "My Sites", url = "mysites/" }
  ]},
  { name = "Writing", category = [
    { name = "Blog", url = "blog/" },
    { name = "Shortblog", url = "shortblog" }
  ]},
  { name = "Todo", url = "todo/" }
]
footer_note = "Made with ❤︎ by Kakalot"
