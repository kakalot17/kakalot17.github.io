# ===== Important Data =====
base_url = "https://kakalot17.github.io"

# ===== Optional Data =====
title = "Kakalot's Site"
description = "Site of a very young man"
author = "Mateus Barbosa"
theme = "ametrine"
taxonomies = [
  { name = "tags" }
]

# ===== Sassy CSS =====
compile_sass = true
# ===== Feeds =====
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

# ===== Markdown =====
[markdown]
github_alerts = true
highlighting = {
  theme = "dracula"
}

# ===== Custom Variables =====
[extra]
accent_color = "blue"

[extra.nav]
links = [
  { name = "Personal", category = [
    { name = "About", url = "about/", icon = "info" },
    { name = "Socials", url = "socials/", icon = "chats" },
    { name = "My Sites", url = "mysites/", icon = "globe" }
  ]},
  { name = "Writing", category = [
    { name = "Blog", url = "blog/", icon = "article" },
    { name = "Shortblog", url = "shortblog/", icon = "dot" }
  ]}
]

[extra.footer]
note = "piss"