# ===== Important Data =====
base_url = "https://kakalot17.github.io"

# ===== Optional Data =====
title = "Kakalot's Site"
description = "Site of a very young man"
author = "Mateus Barbosa"
theme = "ametrine"
taxonomies = [
  { name = "tags" }
]

# ===== Sassy CSS =====
compile_sass = true
# ===== Feeds =====
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

# ===== Markdown =====
[markdown]
github_alerts = true
highlighting = {
  theme = "gruvbox-dark-hard"
}

# ===== Custom Variables =====
[extra]
accent_color = "hsl(29.2, 100%, 50%)"
source_url = "https://github.com/kakalot17/kakalot17.github.io"
styles = ["index.css"]

[extra.nav]
icon = "favicon.jpg"
links = [
  { name = "Writing", category = [
    { name = "Blog", url = "blog/", icon = "article" },
    { name = "Shortblog", url = "shortblog/", icon = "dot" },
    { name = "Todo", url = "todo/", icon = "list-checks" }
  ]},
  { name = "Badges", url = "links/", icon = "seal-check" },
  { name = "Chat", url = "chat/", icon = "chat" }
]

[extra.footer]
note = """Thanks for visiting !!! <br/>
![mybadge](/mybadge.png#pixels)"""
show_powered_by = true
show_source = true

