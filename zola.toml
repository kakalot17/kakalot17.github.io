# ===== Important Data =====
base_url = "https://kakalot17.github.io"

# ===== Optional Data =====
title = "Kakalot's Site"
description = "Site of a very young man"
author = "Mateus Barbosa"
theme = "ametrine"
taxonomies = [
  { name = "tags" }
]

# ===== Sassy CSS =====
compile_sass = true
# ===== Feeds =====
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

# ===== Markdown =====
[markdown]
github_alerts = true
highlighting = {
  theme = "gruvbox-dark-hard"
}

# ===== Custom Variables =====
[extra]
accent_color = "blue"
source_url = "https://github.com/kakalot17/kakalot17.github.io"
styles = ["index.css"]

[extra.nav]
links = [
  { name = "Personal", category = [
    { name = "About", url = "about/", icon = "info" },
    { name = "Socials", url = "socials/", icon = "chats" },
    { name = "My Sites", url = "mysites/", icon = "globe" }
  ]},
  { name = "Writing", category = [
    { name = "Blog", url = "blog/", icon = "article" },
    { name = "Shortblog", url = "shortblog/", icon = "dot" },
    { name = "Todo", url = "todo/", icon = "list-checks" }
  ]},
  { name = "Badges", url = "links/", icon = "seal-check" },
  { name = "Chat", url = "chat/", icon = "chat" }
]

[extra.footer]
note = """Made with ❤︎ by **@Kakalot**!
<script type="text/javascript" src="https://counter.websiteout.com/js/7/0/0/0"></script>"""
show_powered_by = true
show_source = true

