# ===== Important Data =====
base_url = "https://kakalot17.github.io"

# ===== Optional Data =====
title = "Kakalot's Site"
description = "Site of a very young man"
author = "Mateus Barbosa"
taxonomies = [
  { name = "tags" }
]

# ===== Sassy CSS =====
compile_sass = true
# ===== Feeds =====
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

# ===== Markdown =====
[markdown]
github_alerts = true
highlighting = {
  theme = "gruvbox-dark-hard"
}

# ===== Custom Variables =====
[extra]
navbar = [
  { name = "Home", url = "/", icon = "house" },
  { name = "About", url = "about/", icon = "info" },
  { name = "Todo", url = "todo/", icon = "list-checks"},
  { name = "Blog", url = "blog/", icon = "newspaper" },
  { name = "More", url = "more/", icon = "plus" }
]
footer_note = "**Please be patient**"
