name: Deploy Zola site to Pages

on:
  push:
    branches:
      - main  # Mude para master se a sua branch padrão for master
  workflow_dispatch:

# Define as permissões necessárias para o token do GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Garante apenas um deploy por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Zola
        run: sudo snap install zola --channel=latest/stable

      - name: Build Zola Site
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
