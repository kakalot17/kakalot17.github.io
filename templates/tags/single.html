{% extends "base.html" %}

{% block content %}
  <h1>Posts tagged with "{{ term.name }}"</h1>
  {% for page in term.pages %}
    <article>
          <a href="{{ page.permalink }}">
            <h2>{{ page.title | safe }}</h2>
          </a>
          <p>
            {{ page.description | safe }} <br/><br/>

            <small>
              <time>posted {{ page.date | date(format="%Y-%m-%d") }}</time>
            </small>
          </p>
    </article>
  {% endfor %}
{% endblock content %}
