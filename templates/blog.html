{% extends "base.html" %}

{% block content %}
  {{ section.content | safe }}
  {% for page in section.pages %}
      <article>
          <a href="{{ page.permalink }}">
            <h2>{{ page.title | safe }}</h2>
          </a>
          <p>
            {{ page.description | safe }} <br/><br/>

            <small>
              <time>posted {{ page.date | date(format="%Y-%m-%d") }}</time>
            </small>
          </p>
      </article>
  {% endfor %}
{% endblock content %}
