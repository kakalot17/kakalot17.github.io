{% extends "base.html" %}

{% block content %}

<h1>{{ section.title }}</h1>

<ul id="nanolog-list">
  {% for page in section.pages %}
    <li>
      <a href="{{ page.permalink | safe }}">
        <span>{{ page.date | date(format="%B %d, %Y") }}</span>
      </a>
      <div>
        {{ page.content | safe }}
      </div>
    </li>
  {% endfor %}
</ul>
{% endblock content %}
