{% extends "base.html" %}

{% block content %}
  {{ section.content | safe }}
  {% for smolpost in section.pages %}
    <article class="shortpost">
      <small>Posted {{ smolpost.date | date(format="%b %d, %Y") }}</small>
      {{ smolpost.content | safe }}
    </article>
  {% endfor %}
{% endblock content %}
