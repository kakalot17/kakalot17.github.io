{% extends "base.html" %}

{% block content %}
<div id="nanolog-post">
  {%- if page.lower -%}
    <a id="nanolog-higher" href="{{ page.lower.permalink }}#up">
      <span>
        {{ <icon name="arrow-right"/> }}
        {{ page.lower.date | date(format="%B %d, %Y") }}
      </span>
    </a>
  {%- endif -%}

  {{ page.content | safe }}

  {%- if page.higher -%}
    <a id="nanolog-lower" href="{{ page.higher.permalink }}#down">
      <span>
        {{ <icon name="arrow-left"/> }}
        {{ page.higher.date | date(format="%B %d, %Y") }}
      </span>
    </a>
  {%- endif -%}
</div>
{% endblock content %}
